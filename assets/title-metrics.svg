<svg width="100%" height="48" viewBox="0 0 700 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="title-grad-title-metrics" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#D7263D"/>
      <stop offset="75%" stop-color="#0197F6"/>
      <stop offset="100%" stop-color="#D7263D"/>
    </linearGradient>

    <linearGradient id="line-grad-title-metrics" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D7263D" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0197F6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <style>
      @keyframes pulse-title-metrics {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.3); opacity: 1; }
      }
      .star-title-metrics {
        animation: pulse-title-metrics 2.5s ease-in-out infinite;
        transform-origin: 16px 24px;
      }
      .txt-title-metrics {
        font-family: 'Syne', 'Montserrat', 'Arial Black', Impact, sans-serif;
        font-weight: 900;
        letter-spacing: 3.5px;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- 4-Point Celestial Star -->
  <g class="star-title-metrics">
    <path d="M16 14 Q16 24 6 24 Q16 24 16 34 Q16 24 26 24 Q16 24 16 14 Z" fill="#D7263D"/>
  </g>

  <!-- Heavy Brutalist Title Text -->
  <text x="42" y="31" class="txt-title-metrics" font-size="22" fill="url(#title-grad-title-metrics)">
    ACTIVITY &amp; LIVE METRICS
  </text>

  <!-- Subtle Underline Gradient Line -->
  <rect x="42" y="42" width="280" height="2" rx="1" fill="url(#line-grad-title-metrics)"/>
</svg>